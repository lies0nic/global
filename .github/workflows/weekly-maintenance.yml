name: Weekly Global Feed Assets Maintenance

on:
  schedule:
    # Synchronize the global feed assets every Sunday at 10:00 UTC.
    - cron: '0 10 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync-assets:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Synchronize assets
        run: |
          curl -fsSL --retry 3 --create-dirs \
            -A "global-feed-maintenance/1.0" \
            -o feed/rss.xslt https://feeds.acast.com/global/feed/rss.xslt
          curl -fsSL --retry 3 --create-dirs \
            -A "global-feed-maintenance/1.0" \
            -o feed/styles.css https://feeds.acast.com/global/feed/styles.css

      - name: Check for changes and commit
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Changes detected, committing and pushing..."
            git config --local user.name "github-actions[bot]"
            git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add feed/rss.xslt feed/styles.css
            git commit -m "chore(feed): sync global assets"
            git push
          else
            echo "No changes detected. Global assets are up to date."
          fi

      - name: Stage published files
        run: |
          mkdir -p _site/feed
          rsync -a feed/ _site/feed/
          echo "Published content:"
          ls -la _site/feed

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
